name: Download X live replay
on:
  workflow_dispatch:
    inputs:
      url:
        description: Public X video replay URL
        required: true
        default: https://x.com/usamogv/status/2121340113435467785
        type: string

permissions:
  contents: read

jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - name: Install downloader
        run: |
          python -m pip install --upgrade yt-dlp
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
      - name: Download replay
        env:
          VIDEO_URL: ${{ inputs.url }}
        run: |
          mkdir -p downloads
          yt-dlp --no-playlist --retries 10 --fragment-retries 10 \
            --concurrent-fragments 4 --merge-output-format mp4 \
            --restrict-filenames -o "downloads/%(id)s.%(ext)s" "$VIDEO_URL"
      - name: Upload downloaded video
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: x-live-replay
          path: downloads/
          if-no-files-found: warn
          retention-days: 7
          compression-level: 0
